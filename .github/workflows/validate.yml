name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check hook scripts are executable
        run: |
          failed=0
          for f in hooks/scripts/*.sh skills/*/scripts/*.sh install.sh; do
            [ -f "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "::error file=$f::Not executable"
              failed=1
            fi
          done
          exit $failed

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # -x follows sourced files (hooks/scripts/patterns.sh)
          find hooks/scripts skills/*/scripts -name '*.sh' -print0 | xargs -0 shellcheck -x
          shellcheck install.sh

      - name: Validate JSON
        run: |
          for f in hooks/hooks.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::Invalid JSON"; exit 1; }
            fi
          done

      - name: Test design skill (structure and scripts)
        run: python3 -m unittest discover -s skills/design/tests -v
      - name: Test kb-m3e (structure)
        run: python3 -m unittest discover -s skills/kb-m3e/tests -v
      - name: Test kb-engineering (structure and helper)
        run: python3 -m unittest discover -s skills/kb-engineering/tests -v
      - name: Test hooks (wiring, voice injection, path resolution)
        run: python3 -m unittest discover -s hooks/tests -v
      - name: Test voice (layers, public text, check-tells)
        run: python3 -m unittest discover -s skills/voice/tests -v
      - name: Test setup (config structure)
        run: python3 -m unittest discover -s skills/setup/tests -v
      - name: Test devline pipeline (structure)
        run: python3 -m unittest discover -s skills/devline/tests -v
